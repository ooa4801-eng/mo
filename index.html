<style>
:root{--bg:#eef0f4;--card:#fff;--ink:#15203a;--mut:#667085;--line:#d5d9e2;--br:#15203a;--in:#f8f9fb;--box-sizing:border-box;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1a202c;--ink:#e8ecf4;--mut:#9aa4b5;--line:#2c3547;--in:#121722}}
:root[data-theme="dark"]{--bg:#10141c;--card:#1a202c;--ink:#e8ecf4;--mut:#9aa4b5;--line:#2c3547;--in:#121722}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;font-size:15px;padding-bottom:96px}
.top{background:var(--br);color:#fff;padding:18px 16px;display:flex;align-items:center;gap:14px;transition:background .3s}
.top img{height:52px;border-radius:6px;display:none;background:#fff}
.top h1{margin:0;font-size:21px;font-weight:700}.top p{margin:2px 0 0;font-size:13px;opacity:.85}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px;font-weight:700}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g .w{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--in);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-height:40px}
textarea{resize:vertical}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:var(--in);color:var(--ink);padding:8px 12px;min-height:40px}
.pri{background:var(--br);color:#fff;border-color:var(--br);font-weight:700}
.wr,.mm{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 1fr 90px;gap:8px}
.wr .d{grid-column:1/-1}.wr .x{grid-column:1/-1;text-align:left}
.wr .x button,.mm .x button{min-height:32px;padding:2px 10px;color:#b42318}
.mm{grid-template-columns:1fr 1fr}.mm .w{grid-column:1/-1}.mm h3{margin:0;font-size:15px}
.sc{overflow-x:auto}table.eq{border-collapse:collapse;width:100%;min-width:420px}
.eq th,.eq td{border:1px solid var(--line);padding:4px;text-align:center;font-size:13px}
.eq select{min-height:34px;padding:2px}.eq input{min-height:30px;padding:2px;margin-top:3px}
.fri{background:rgba(120,130,150,.22)}
.bar{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center}
.bar button{flex:1;max-width:340px}
#msg{text-align:center;padding:6px;font-size:14px;color:#b42318;min-height:20px}
#stage{position:absolute;left:-10000px;top:0}
.sheet{width:794px;min-height:1123px;padding:42px 46px;background:#fff;color:#111;direction:rtl;font-family:Cairo,Tahoma,sans-serif;font-size:15px;position:relative}
.sh{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--b);padding-bottom:12px;margin-bottom:16px}
.sh img{height:64px}.sh b{display:block;font-size:17px;color:var(--b)}.sh h2{margin:6px 0 0;font-size:25px}
.mt{width:100%;border-collapse:collapse;margin-bottom:14px}.mt td{padding:5px 8px;border:1px solid #ccd;font-size:14px}.mt td:nth-child(odd){background:#f1f3f7;font-weight:700;width:15%}
.dt{width:100%;border-collapse:collapse}.dt th{background:var(--b);color:#fff;padding:8px;font-size:14px}.dt td{border:1px solid #aab;padding:8px;font-size:14px;text-align:center;vertical-align:middle}.dt td.r{text-align:right}
.sg{display:flex;justify-content:space-around;margin-top:70px;text-align:center;font-weight:700;gap:10px}.sg span{display:block;margin-top:46px;font-weight:400;font-size:13px}
.ln{border-bottom:1px dotted #777;padding:4px 6px;margin:6px 0 12px;min-height:30px;font-size:16px}
</style></head><body>

function addW(){const d=document.createElement('div');d.className='wr';d.innerHTML='<textarea class="d" rows="2" placeholder="الأعمال المنفذة (مثال: تم الانتهاء من أعمدة الدور الثاني)"></textarea><input class="pl" placeholder="المكان (دور / محور)"><input class="nt" placeholder="ملاحظات"><input class="pc" type="number" min="0" max="100" placeholder="النسبة %"><div class="x"><button onclick="this.closest(\'.wr\').remove()">حذف</button></div>';$('ws').appendChild(d)}
function addM(t){const d=document.createElement('div');d.className='mm';d.dataset.t=t;d.innerHTML=`<div class="w" style="display:flex;justify-content:space-between"><h3>مذكرة ${t}</h3><span class="x"><button onclick="this.closest('.mm').remove()">حذف</button></span></div><div class="w"><label>المقاول</label><input class="mc" value="${esc($('ct').value)}"></div><div><label>المبلغ (جنيه)</label><input class="ma" type="number"></div><div><label>فقط وقدره</label><input class="mw"></div>${t=='خصم'?'<div class="w"><label>تخصم لصالح</label><input class="mf"></div>':''}<div class="w"><label>سبب ${t=='خصم'?'الخصم':'الإضافة'}</label><textarea class="mr" rows="3"></textarea></div>`;$('ms').appendChild(d)}
function addE(){const v=$('en').value.trim();if(v&&!EN.includes(v)){EN.push(v);$('en').value='';rEq()}}
function days(){const f=$('ef').value,t=$('et').value;if(!f||!t||t<f)return[];const a=[];let d=new Date(f+'T00:00:00');const e=new Date(t+'T00:00:00');while(d<=e&&a.length<62){a.push(new Date(d));d.setDate(d.getDate()+1)}return a}
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function rEq(){const D=days();if(!D.length||!EN.length){$('eg').innerHTML='<p style="color:var(--mut);margin:0">حدد الفترة وأضف معدة ليظهر الجدول.</p>';return}
 let h='<table class="eq"><tr><th>اليوم</th><th>التاريخ</th>'+EN.map((n,j)=>`<th>${esc(n)} <button style="min-height:22px;padding:0 6px" onclick="EN.splice(${j},1);rEq()">×</button></th>`).join('')+'</tr>';
 D.forEach(d=>{const f=d.getDay()==5;h+=`<tr class="${f?'fri':''}"><td>${DN[d.getDay()]}</td><td>${d.getDate()}/${d.getMonth()+1}</td>`+EN.map(n=>{const k=ds(d)+'|'+n,v=M[k]||{s:'',h:''};return`<td><select data-k="${esc(k)}">${[['','—'],['1','يوم'],['0.5','نصف يوم'],['h','ساعات']].map(o=>`<option value="${o[0]}"${v.s==o[0]?' selected':''}>${o[1]}</option>`).join('')}</select><input type="number" min="0" step="0.5" data-h="${esc(k)}" value="${v.h}" style="display:${v.s=='h'?'block':'none'}"></td>`}).join('')+'</tr>'});
 h+='<tr><th colspan="2">الإجمالي</th>'+EN.map((n,j)=>`<th id="t${j}"></th>`).join('')+'</tr></table>';$('eg').innerHTML=h;tot()}
function tot(){EN.forEach((n,j)=>{const r=eqT(n);const e=$('t'+j);if(e)e.textContent=r})}
function eqT(n){let d=0,h=0;Object.keys(M).forEach(k=>{if(k.split('|')[1]!=n)return;const v=M[k];if(v.s=='1')d+=1;else if(v.s=='0.5')d+=.5;else if(v.s=='h')h+=+v.h||0});return(d?d+' يوم':'')+(d&&h?' + ':'')+(h?h+' ساعة':'')||'—'}

rEq();addW();

  S.push(`<div style="--b:${c.c}"><div class="sh"><div><b>${c.n}</b><h2>مذكرة ${t}</h2></div><img src="${c.l}"></div><p><b>التاريخ:</b> ${$('dt').value.split('-').reverse().join('/')}</p><p><b>الموقع:</b> ${esc(p[0])} &nbsp;&nbsp; <b>القطعة:</b> ${esc($('lc').value)}</p><p><b>المقاول:</b> ${g('.mc')}</p><p><b>يرجى ${t} مبلغ</b> ${g('.ma')} <b>جنيه</b></p><p><b>فقط وقدره</b></p><div class="ln">${g('.mw')}</div><p><b>سبب ${t=='خصم'?'الخصم':'الإضافة'}:</b></p><div class="ln" style="min-height:130px">${g('.mr').replace(/\n/g,'<br>')}</div>${t=='خصم'?`<p><b>تخصم لصالح /</b> ${g('.mf')}</p>`:''}<div class="sg" style="margin-top:90px"><div>المقاول</div><div>مدير المشروع</div></div><div class="sg" style="margin-top:50px;font-size:13px"><div>مدير المشروعات<br>م. وائل شوقي</div><div>المدير التنفيذي<br>م. أشرف عبد البديع</div></div></div>`)});
 return S}
async function gen(share){const m=$('msg');m.textContent='';const p=PR[$('pr').value];
 if(!p||!$('ct').value.trim()||!$('mv').value){m.textContent='اختر المشروع، واكتب اسم المقاول، وحدد حركة المستخلص.';return}
 const S=sheets(p);if(!S.length){m.textContent='أضف عملاً واحداً على الأقل، أو بيان معدات، أو مذكرة.';return}
 m.style.color='var(--mut)';m.textContent='جاري إنشاء الـ PDF…';
 try{const st=$('stage');st.innerHTML=S.map(s=>`<div class="sheet" style="--b:${CO[p[1]].c}">${s}</div>`).join('');await document.fonts.ready;
  const pdf=new jspdf.jsPDF({unit:'mm',format:'a4'});let first=true;
  for(const el of st.children){const cv=await html2canvas(el,{scale:2,backgroundColor:'#fff'});const ph=Math.round(cv.width*1123/794);
   for(let y=0;y<cv.height-4||y==0;y+=ph){const h=Math.min(ph,cv.height-y),c2=document.createElement('canvas');c2.width=cv.width;c2.height=ph;const x=c2.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c2.width,ph);x.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
    if(!first)pdf.addPage();first=false;pdf.addImage(c2.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297)}}
  const name=`الموقف التنفيذي - ${$('ct').value.trim()} - ${$('dt').value}.pdf`,blob=pdf.output('blob');
  try{const a=JSON.parse(localStorage.getItem('ct')||'[]'),c=$('ct').value.trim();if(!a.includes(c)){a.push(c);localStorage.setItem('ct',JSON.stringify(a))}}catch(e){}
  m.textContent='';let done=false;
  if(share&&navigator.canShare){const f=new File([blob],name,{type:'application/pdf'});if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});done=true}catch(e){if(e.name=='AbortError')return}}}
  if(!done){const d=await window.claude?.use?.('downloads');if(d){await d.save({filename:name,data:blob})}else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}}
 }catch(e){m.style.color='#b42318';m.textContent='تعذر إنشاء الـ PDF. حاول مرة أخرى.'}}
</script></body></html>
